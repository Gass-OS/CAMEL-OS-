<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7a9"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e761d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.45"/>

  <!-- Gold Microchip PCB Pins (Top, Bottom, Left, Right) -->
  <g fill="url(#goldGrad)">
    <rect x="170" y="88" width="16" height="46" rx="6"/>
    <rect x="212" y="88" width="16" height="46" rx="6"/>
    <rect x="254" y="88" width="16" height="46" rx="6"/>
    <rect x="296" y="88" width="16" height="46" rx="6"/>
    <rect x="338" y="88" width="16" height="46" rx="6"/>

    <rect x="170" y="378" width="16" height="46" rx="6"/>
    <rect x="212" y="378" width="16" height="46" rx="6"/>
    <rect x="254" y="378" width="16" height="46" rx="6"/>
    <rect x="296" y="378" width="16" height="46" rx="6"/>
    <rect x="338" y="378" width="16" height="46" rx="6"/>

    <rect x="88" y="170" width="46" height="16" rx="6"/>
    <rect x="88" y="212" width="46" height="16" rx="6"/>
    <rect x="88" y="254" width="46" height="16" rx="6"/>
    <rect x="88" y="296" width="46" height="16" rx="6"/>
    <rect x="88" y="338" width="46" height="16" rx="6"/>

    <rect x="378" y="170" width="46" height="16" rx="6"/>
    <rect x="378" y="212" width="46" height="16" rx="6"/>
    <rect x="378" y="254" width="46" height="16" rx="6"/>
    <rect x="378" y="296" width="46" height="16" rx="6"/>
    <rect x="378" y="338" width="46" height="16" rx="6"/>
  </g>

  <!-- Main Silicon Chip Package -->
  <rect x="130" y="130" width="252" height="252" rx="34" fill="#141418" stroke="url(#goldGrad)" stroke-width="8"/>
  <rect x="158" y="158" width="196" height="196" rx="22" fill="#0d0d10" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.55"/>

  <!-- Precision Hardware Pulse Waveform inside Chip Die -->
  <polyline points="174,258 214,258 234,208 258,308 282,226 300,258 338,258" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
