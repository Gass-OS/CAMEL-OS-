<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7a9"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e761d"/>
    </linearGradient>
    <radialGradient id="glassGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#2c2414"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.45"/>

  <!-- Precision pro camera barrel outer ring -->
  <circle cx="256" cy="256" r="158" fill="#101014" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.65"/>

  <!-- Glass element center -->
  <circle cx="256" cy="256" r="112" fill="url(#glassGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- 6-Blade Golden Aperture Diaphragm -->
  <g stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.88">
    <line x1="256" y1="146" x2="298" y2="226"/>
    <line x1="351" y1="201" x2="294" y2="268"/>
    <line x1="351" y1="311" x2="256" y2="296"/>
    <line x1="256" y1="366" x2="214" y2="286"/>
    <line x1="161" y1="311" x2="218" y2="244"/>
    <line x1="161" y1="201" x2="256" y2="216"/>
  </g>

  <!-- Inner hexagonal iris & optical glint -->
  <circle cx="256" cy="256" r="38" fill="#070708" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="232" cy="232" r="11" fill="#f7e7a9" fill-opacity="0.85"/>
  <circle cx="274" cy="276" r="5" fill="#d4af37" fill-opacity="0.7"/>
</svg>
