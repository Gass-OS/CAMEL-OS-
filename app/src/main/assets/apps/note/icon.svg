<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7a9"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e761d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.45"/>

  <!-- Luxury folded corner note sheet -->
  <path d="M126 102 L322 102 L386 166 L386 410 L126 410 Z" fill="#18181b" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M322 102 L322 166 L386 166 Z" fill="url(#goldGrad)" fill-opacity="0.35" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Ruled gold lines -->
  <line x1="168" y1="208" x2="344" y2="208" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="168" y1="262" x2="318" y2="262" stroke="#d4af37" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round"/>
  <line x1="168" y1="316" x2="274" y2="316" stroke="#d4af37" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round"/>

  <!-- Diagonal gilded fountain stylus -->
  <g transform="rotate(-38 336 336)">
    <rect x="314" y="218" width="44" height="156" rx="10" fill="url(#goldGrad)"/>
    <polygon points="314,374 358,374 336,422" fill="#f7e7a9"/>
    <rect x="314" y="246" width="44" height="10" fill="#0b0b0d"/>
  </g>
</svg>
