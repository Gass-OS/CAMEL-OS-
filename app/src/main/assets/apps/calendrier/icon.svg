<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8b6508" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Calendar Outer Box -->
  <rect x="96" y="112" width="320" height="320" rx="36" fill="#121212" stroke="url(#goldGrad)" stroke-width="12" />
  <!-- Top Header Banner -->
  <path d="M 108 148 Q 108 136 120 136 L 392 136 Q 404 136 404 148 L 404 200 L 108 200 Z" fill="url(#goldGrad)" />
  <!-- Rings -->
  <rect x="160" y="88" width="24" height="48" rx="12" fill="url(#goldGrad)" />
  <rect x="328" y="88" width="24" height="48" rx="12" fill="url(#goldGrad)" />
  <!-- Date Number -->
  <text x="256" y="340" text-anchor="middle" fill="#d4af37" font-family="Outfit, sans-serif" font-weight="800" font-size="120">16</text>
  <!-- Little Accent Dot -->
  <circle cx="256" cy="380" r="8" fill="#d4af37" />
</svg>
