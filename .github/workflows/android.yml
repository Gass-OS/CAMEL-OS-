# CAMEL-OS Android CI — Phase 0
#
# First automated build for CAMEL-OS. Runs on push to main and on demand.
# - JDK 21 (approved by Aymen, 2026-11-17; Gradle 9.3.1 + AGP 9.1.1 need JDK 17+)
# - Builds the debug APK and uploads it as an artifact.
# - Does NOT run unit tests yet: ExampleRobolectricTest fails by construction
#   (it asserts the app name is "My Application" while strings.xml says
#   "Camel OS" — audit finding B6). Tests will be fixed and enabled in a
#   later phase; running them now would turn the first CI run red for a
#   known non-build issue.
# - Does NOT need google-services.json: the build sets
#   googleServices.missing.passthrough=true, so it compiles without Firebase
#   configured (Europass AI simply stays unconfigured at runtime — audit B5).
# - The repo's debug signing config (app/build.gradle.kts) requires
#   ${rootDir}/debug.keystore with the standard debug credentials
#   (alias androiddebugkey, passwords "android"). The keystore is gitignored
#   and absent from the repo, so CI generates it when missing. The signing
#   config itself is left untouched, per the comment in build.gradle.kts.
name: CAMEL-OS Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMEL-OS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
